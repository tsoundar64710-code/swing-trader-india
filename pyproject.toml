[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingtrader-india"
version = "0.1.0"
description = "AI Swing-Trading Research Assistant — India (research + paper trading only)"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=6.0",
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert allowed in tests; core code avoids asserts for control flow
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]
"src/swingtrader/ui/app.py" = ["E402"]  # sys.path bootstrap runs before imports
